<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Estoque de Uniformes · Vegas Vigilância</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --preto:#000;--grafite:#121417;--grafite2:#1b1e22;--grafite3:#262a2f;
  --linha:rgba(214,218,224,.12);--linha2:rgba(214,218,224,.25);
  --prata:#cdd1d6;--prata2:#9aa0a7;--texto:#eceef0;--suave:#a3a9b0;--fraco:#6f757c;
  --cromo:linear-gradient(180deg,#fbfcfc 0%,#d3d7db 38%,#7c8289 52%,#c3c7cc 70%,#eef0f2 100%);
  --cromo-btn:linear-gradient(180deg,#f2f3f4 0%,#c9cdd2 48%,#9ea4ab 52%,#d7dadd 100%);
  --ok:#86c29b;--aviso:#d8a94a;--erro:#e46d72;
  --r1:6px;--r2:12px;--r3:18px;
  --display:'Saira Condensed','Arial Narrow',sans-serif;--corpo:'Barlow','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--preto);color:var(--texto);font-family:var(--corpo);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1100px 500px at 80% -10%,rgba(205,209,214,.09),transparent 60%),linear-gradient(180deg,#0a0b0d,#000 70%)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--prata);outline-offset:2px}
[hidden]{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:100%;max-width:380px;padding:30px 26px;border-radius:var(--r3);background:linear-gradient(180deg,rgba(30,33,37,.95),rgba(10,11,13,.98));border:1px solid var(--linha2);box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);text-align:center}
.login img{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--linha2),0 0 40px rgba(205,209,214,.12)}
.login h1{margin:10px 0 0;font-family:var(--display);font-size:46px;font-weight:800;line-height:1;background:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}
.login p{margin:4px 0 22px;color:var(--suave)}
.login label{text-align:left}

/* moldura */
.topo{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topo img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--linha2)}
.topo .t{display:flex;flex-direction:column;line-height:1}
.topo .t b{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:.03em;background:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}
.topo .t span{font-size:12px;color:var(--suave);letter-spacing:.04em}
.topo .u{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--suave);font-size:13px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 61px)}
nav.menu{border-right:1px solid var(--linha);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
nav.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:var(--r1);color:var(--suave);cursor:pointer;font-weight:500}
nav.menu button:hover{background:var(--grafite2);color:var(--texto)}
nav.menu button[aria-current=page]{background:var(--grafite2);color:var(--texto);box-shadow:inset 3px 0 0 var(--prata)}
nav.menu .cont{margin-left:auto;font-size:12px;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--grafite3);color:var(--prata)}
nav.menu .cont.alerta{background:rgba(228,109,114,.18);color:var(--erro)}
main{padding:22px 26px 60px;min-width:0}
h2.tit{margin:0 0 4px;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.02em}
p.sub{margin:0 0 18px;color:var(--suave)}
h3.sec{margin:28px 0 10px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:10px}

/* componentes */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:var(--r2);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 70%),var(--grafite);border:1px solid var(--linha);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.kpi span{display:block;color:var(--suave);font-size:13px}
.kpi b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{color:var(--fraco);font-size:12.5px}
.kpi.destaque b{background:linear-gradient(180deg,#fff 0%,#e3e6e9 55%,#a2a8ae 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi b.longo{font-size:clamp(19px,2.2vw,26px)}
.kpi.alerta{border-color:rgba(228,109,114,.4)} .kpi.alerta b{color:var(--erro)}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.barra label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--suave);min-width:130px;flex:1}
.barra .acoes{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
input,select,textarea{width:100%;background:#050607;border:1px solid var(--linha2);border-radius:var(--r1);padding:8px 10px;min-height:38px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--prata);box-shadow:0 0 0 3px rgba(205,209,214,.12)}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:#c9cdd2}
textarea{min-height:70px;resize:vertical}
label.c{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--suave)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 14px;border-radius:var(--r1);border:1px solid var(--linha2);background:var(--grafite2);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--prata2)}
.btn.p{border:0;color:#0b0c0d;background:var(--cromo-btn);box-shadow:inset 0 1px 0 #fff}
.btn.p:hover{filter:brightness(1.06)}
.btn.perigo{border-color:rgba(228,109,114,.45);color:#f0a8ab}
.btn.peq{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:wait}
.tabela{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--r2);background:var(--grafite)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
th{color:var(--suave);font-weight:500;font-size:12px;background:rgba(0,0,0,.35);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.baixo td{background:rgba(216,169,74,.05)} tr.zero td{background:rgba(228,109,114,.06)}
.selo{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--linha2);color:var(--prata);white-space:nowrap}
.selo.ok{color:var(--ok);border-color:rgba(134,194,155,.45)} .selo.aviso{color:var(--aviso);border-color:rgba(216,169,74,.45)} .selo.erro{color:var(--erro);border-color:rgba(228,109,114,.45)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{border:1px solid var(--linha);border-radius:var(--r2);background:var(--grafite);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card header b{font-family:var(--display);font-size:19px;letter-spacing:.04em}
.card .meta{color:var(--suave);font-size:13px}
.card .acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--linha)}
.card table{font-size:13px} .card th,.card td{padding:5px 6px}
.alertas{display:grid;gap:8px}
.alerta-l{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r1);border:1px solid rgba(216,169,74,.35);background:rgba(216,169,74,.05)}
.alerta-l.zero{border-color:rgba(228,109,114,.45);background:rgba(228,109,114,.06)}
.alerta-l b{font-weight:600}
.alerta-l .q{font-family:var(--display);font-size:22px;font-weight:700}
.vazio{padding:22px;text-align:center;color:var(--suave);border:1px dashed var(--linha2);border-radius:var(--r2)}
details.hist summary{cursor:pointer;color:var(--suave);font-size:12.5px}
details.hist ol{margin:6px 0 0;padding-left:18px;color:var(--suave);font-size:12.5px}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mais{display:block;margin:14px auto 0}
.tot{font-family:var(--display);font-size:22px;font-weight:700}

/* modal */
.fundo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal{width:100%;max-width:640px;background:linear-gradient(180deg,#1d2024,#0f1113);border:1px solid var(--linha2);border-radius:var(--r3);box-shadow:0 40px 100px rgba(0,0,0,.9);padding:22px}
.modal.largo{max-width:1040px}
.modal h3{margin:0 0 4px;font-family:var(--display);font-size:24px;font-weight:700}
.modal .sub{color:var(--suave);margin:0 0 16px}
.modal .rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.erro-m{color:#f2b8bb;background:rgba(228,109,114,.08);border:1px solid rgba(228,109,114,.4);border-radius:var(--r1);padding:9px 12px;margin-top:12px}
.aviso-m{color:#ecd5a4;background:rgba(216,169,74,.07);border:1px solid rgba(216,169,74,.35);border-radius:var(--r1);padding:9px 12px;margin-top:12px;font-size:13px}
.chk input[type=number]{width:72px}
.chk td{padding:6px}
.chk tr.err td{background:rgba(228,109,114,.08)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;z-index:80;padding:11px 18px;border-radius:var(--r1);background:#1d2024;border:1px solid var(--linha2);box-shadow:0 10px 40px rgba(0,0,0,.7);max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.erro{border-color:rgba(228,109,114,.6);color:#f2b8bb}
.carregando{position:fixed;top:61px;left:0;right:0;height:2px;z-index:30;background:linear-gradient(90deg,transparent,var(--prata),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:corre 1s linear infinite}
@keyframes corre{from{background-position:-40% 0}to{background-position:140% 0}}
.fichares{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.thumb{width:110px;height:110px;object-fit:cover;border-radius:var(--r1);border:1px solid var(--linha2);cursor:zoom-in;background:#fff}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.menu{position:sticky;top:61px;z-index:15;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--linha);padding:8px;background:rgba(0,0,0,.92)}
  nav.menu button{width:auto;white-space:nowrap;padding:8px 12px}
  nav.menu button[aria-current=page]{box-shadow:inset 0 -2px 0 var(--prata)}
  main{padding:16px 12px 60px}
  .cards{grid-template-columns:1fr}
  .grade2,.grade3,.fichares{grid-template-columns:1fr}
  .topo .t span,.topo .u .nm,.topo .u .selo{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:12px}.kpi b{font-size:26px}
  .alerta-l{grid-template-columns:minmax(0,1fr) auto}.alerta-l>div:last-child{grid-column:1/-1}
  .barra label{min-width:calc(50% - 6px)}
}
@media (prefers-reduced-motion:reduce){.carregando{animation:none}}
</style>
</head>
<body>

<section class="login" id="telaLogin">
  <form onsubmit="entrar(event)">
    <img src="assets/vegaslogo.jpg" alt="Escudo Vegas">
    <h1>VEGAS</h1>
    <p>Estoque e controle de uniformes</p>
    <label class="c">Usuário<input id="lUsuario" autocomplete="username" required></label>
    <label class="c" style="margin-top:12px">Senha<input id="lSenha" type="password" autocomplete="current-password" required></label>
    <div class="erro-m" id="lErro" hidden></div>
    <button class="btn p" style="width:100%;margin-top:18px;min-height:46px" id="lBtn">Entrar</button>
  </form>
</section>

<div id="telaApp" hidden>
  <header class="topo">
    <img src="assets/vegaslogo.jpg" alt="">
    <div class="t"><b>VEGAS</b><span>Estoque de uniformes</span></div>
    <div class="u"><span class="nm" id="uNome"></span><span class="selo" id="uPerfil"></span>
      <button class="btn peq" onclick="carregar()">Atualizar</button><button class="btn peq" onclick="sair()">Sair</button></div>
  </header>
  <div class="carregando" id="barraCarga" hidden></div>
  <div class="app">
    <nav class="menu" id="menu"></nav>
    <main id="conteudo"></main>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwexMtw2Ttr_OoIc24r7g7qyVeoJu-RTFhRopbou6sO_MwfXSGpwxFkE6mH6eB09AVbkA/exec";

/* nomes usados no formulário do funcionário: cadastrar com o mesmo nome faz a peça aparecer no kit do posto */
const NOMES_KIT = ["Apito","Baleiro","Blazer","Blusa cinza","Blusa de Frio","Blusa Preta","Blusa preta serviços","Blusa preta vigilância","Boné","Botina","Botom preto vigilante","Calça elástico cinza","Calça jeans","Calça social","Calça Tática","Calça vigilante tática","Camisa ASG","Camisa porteiro","Camisa Preta","Camisa social branca","Camisa social preta","Camisa vigilante bege curta","Camisa vigilante bege longa","Capa para placa balística","Casaco Preto","Casaco preto serviços","Casaco preto vigilância","Casaco vigilância","Cinto","Cinto tático","Cobertura/Boné","Coldre","Coturno","Fiel","Galocha","Gandola","Gandola Cinza","Gandola Preta","Gravata","Sapato social","Touca","Touca vegas vigilância"];
const CATEGORIAS = ["Camisa","Calça","Agasalho","Calçado","Acessório","Equipamento","Outros"];

const ST = { AGUARD:"Aguardando aprovação", APROV:"Aprovado", SEPAR:"Separando peças", DISP:"Disponível para retirada", ENTPARC:"Entregue parcialmente",
  ENTREG:"Entregue ao funcionário", DEVPEND:"Devolução pendente", DEVPARC:"Parcialmente devolvido", DEVOK:"Devolução concluída", CANC:"Cancelado" };
const LEGADO = { "EM ANÁLISE":ST.AGUARD, "PENDENTE":ST.APROV, "SEPARADO":ST.DISP, "ENTREGUE":ST.ENTREG };
const FIN = ["Em análise","Aguardando aprovação","Aprovado administrativamente","Contestação registrada","Resolvido","Cancelado após revisão"];
const TIPOS_MOV = { ENTRADA_INICIAL:"Entrada inicial", ENTRADA_COMPRA:"Entrada por compra", ENTRADA_DEVOLUCAO:"Entrada por devolução", SAIDA_ENTREGA:"Saída por entrega",
  RESERVA:"Reserva", RESERVA_LIBERADA:"Reserva liberada", AJUSTE_MANUAL:"Ajuste manual", BAIXA_DANO:"Baixa por dano", BAIXA_EXTRAVIO:"Baixa por extravio",
  QUARENTENA_DEVOLUCAO:"Quarentena (devolução danificada)", QUARENTENA_LIBERADA:"Quarentena liberada", BAIXA_INUTILIZADA:"Baixa (inutilizada)", NAO_DEVOLVIDA:"Não devolvida",
  ALERTA_ESTOQUE_BAIXO:"Alerta: estoque baixo", ALERTA_SEM_ESTOQUE:"Alerta: sem estoque", ALERTA_NORMALIZADO:"Alerta normalizado" };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const dig = s => String(s || "").replace(/\D/g, "");
const brl = v => Number(v || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const int = v => Math.floor(Number(v) || 0);
const fData = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString("pt-BR", { dateStyle:"short", timeStyle:"short" }); };
const fDia = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleDateString("pt-BR"); };
const diaISO = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const stOf = p => LEGADO[p.status] || p.status;

let TOKEN = sessionStorage.getItem("vegasUnifToken") || "", EU = JSON.parse(sessionStorage.getItem("vegasUnifUser") || "null");
let D = null, VIEW = "painel", filtros = {}, limite = 60;

/* ───────── rede ───────── */
async function api(acao, dados = {}, opt = {}) {
  $("barraCarga").hidden = false;
  try {
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ acao, token: TOKEN, ...dados }) });
    const j = await r.json();
    if (j.auth) { sair(true); throw new Error(j.erro); }
    if (j.dados) { D = j.dados; if (!opt.semRender) render(); }
    return j;
  } catch (e) {
    if (e instanceof TypeError) throw new Error("Sem conexão com o servidor. Tente de novo.");
    throw e;
  } finally { $("barraCarga").hidden = true; }
}
let _tt;
function toast(msg, erro) { const t = $("toast"); t.textContent = msg; t.className = "on" + (erro ? " erro" : ""); clearTimeout(_tt); _tt = setTimeout(() => t.className = "", 3800); }

/* ───────── sessão ───────── */
async function entrar(ev) {
  ev.preventDefault(); $("lErro").hidden = true; $("lBtn").disabled = true;
  try {
    const r = await api("login", { usuario: $("lUsuario").value, senha: $("lSenha").value });
    if (!r.sucesso) throw new Error(r.erro);
    TOKEN = r.token; EU = r.usuario;
    sessionStorage.setItem("vegasUnifToken", TOKEN); sessionStorage.setItem("vegasUnifUser", JSON.stringify(EU));
    $("lSenha").value = ""; iniciar();
  } catch (e) { $("lErro").textContent = e.message; $("lErro").hidden = false; }
  finally { $("lBtn").disabled = false; }
}
function sair(expirou) {
  if (!expirou && TOKEN) api("logout").catch(() => {});
  TOKEN = ""; EU = null; D = null; sessionStorage.removeItem("vegasUnifToken"); sessionStorage.removeItem("vegasUnifUser");
  $("telaApp").hidden = true; $("telaLogin").hidden = false; fecharModal();
  if (expirou === true) { $("lErro").textContent = "Sua sessão expirou. Entre novamente."; $("lErro").hidden = false; }
}
async function iniciar() {
  $("telaLogin").hidden = true; $("telaApp").hidden = false;
  $("uNome").textContent = EU.nome; $("uPerfil").textContent = EU.perfil === "admin" ? "Administrador" : "Estoque";
  await carregar();
}
async function carregar() {
  try { const r = await api("painel", {}, { semRender: true }); if (!r.sucesso) throw new Error(r.erro); D = r.dados; render(); }
  catch (e) { toast(e.message, true); }
}

/* ───────── cálculos ───────── */
const disp = p => int(p.saldo) - int(p.reservado);
const minimo = p => p.minimo === "" || p.minimo == null ? 5 : int(p.minimo);
const pendEnt = e => int(e.qtdEntregue) - int(e.qtdDevolvida) - int(e.qtdDanificada) - int(e.qtdFaltante);
function pedidoDe(prot) { return D.pedidos.find(p => p.protocolo === prot); }
function indicadores() {
  const at = D.pecas.filter(p => p.ativo === "SIM");
  const emDev = new Set(D.pedidos.filter(p => [ST.DEVPEND, ST.DEVPARC].includes(p.status)).map(p => p.protocolo));
  const k = { disp:0, vDisp:0, res:0, vEst:0, quar:0, com:0, vCom:0, dev:0, vDev:0, falt:0, vFalt:0, dan:0, alertas:0 };
  at.forEach(p => { const d = Math.max(0, disp(p)); k.disp += d; k.vDisp += d * Number(p.valorUnit||0); k.res += int(p.reservado); k.vEst += int(p.saldo) * Number(p.valorUnit||0); k.quar += int(p.quarentena); if (p.alertaAtivo === "SIM") k.alertas++; });
  D.entregas.forEach(e => { const pe = pendEnt(e), v = pe * Number(e.valorUnit||0); k.com += pe; k.vCom += v; if (emDev.has(e.protocolo)) { k.dev += pe; k.vDev += v; } });
  D.devolucoes.forEach(d => { k.falt += int(d.qtdFaltante); k.vFalt += Number(d.valorFaltante||0); k.dan += int(d.qtdDanificada); });
  k.aguard = D.pedidos.filter(p => stOf(p) === ST.AGUARD).length;
  k.ocAbertas = D.ocorrencias.filter(o => !/Resolvido|Cancelado/.test(o.status)).length;

}
function funcionarios() {
  const m = {};
  D.pedidos.forEach(p => { const c = dig(p.cpf); if (!c) return; const f = m[c] = m[c] || { cpf: p.cpf, nome: p.nome, pedidos: [] }; f.pedidos.push(p);

}

let _ft;

async function confirmarEntrega(prot) {

function vDevolucoes() {
  const f = filtros;
  if (f.cpf) return vChecklistDevolucao(f.cpf);

  D.entregas.forEach(e => { const pe = pendEnt(e); if (pe <= 0) return; const c = dig(e.cpf);
    const x = m[c] = m[c] || { cpf: e.cpf, nome: e.nome, qtd: 0, valor: 0, posto: e.posto, prots: new Set() }; x.qtd += pe; x.valor += pe * Number(e.valorUnit||0); x.prots.add(e.protocolo); });
  const devPend = new Set(D.pedidos.filter(p => [ST.DEVPEND, ST.DEVPARC].includes(p.status)).map(p => dig(p.cpf)));
  const lista = Object.entries(m).filter(([c, x]) => !f.q || norm(x.nome).includes(norm(f.q)) || c.includes(dig(f.q) || "@"))
    .sort((a,b) => (devPend.has(b[0]) - devPend.has(a[0])) || a[1].nome.localeCompare(b[1].nome));

function devTudo(campo) {
  document.querySelectorAll(".chk tbody tr").forEach(tr => { ["boa","desgaste","danificada","faltante"].forEach(k => tr.querySelector(".d-" + k).value = k === campo ? tr.dataset.pend : 0); });
  calcDev();
}
function calcDev() {
  let tf = 0, td = 0, ok = true;
  document.querySelectorAll(".chk tbody tr").forEach(tr => {
    const v = k => int(tr.querySelector(".d-" + k).value), soma = v("boa") + v("desgaste") + v("danificada") + v("faltante");
    const err = soma > int(tr.dataset.pend) || ["boa","desgaste","danificada","faltante"].some(k => v(k) < 0);

  const f = filtros, tipo = f.tipo || "estoque", R = RELATORIOS[tipo], res = R.gerar(f);
  const cidades = [...new Set(D.entregas.map(e => e.cidade).filter(Boolean))].sort();

      <label style="min-width:240px">Relatório<select onchange="filtros={tipo:this.value};render()">${Object.entries(RELATORIOS).map(([k,v]) => `<option value="${k}" ${k===tipo?"selected":""}>${v.nome}</option>`).join("")}</select></label>

      <label>Posto<input value="${esc(f.posto||"")}" oninput="filtrar('posto',this.value)"></label>
      <div class="acoes"><button class="btn p" onclick="exportarRel('pdf')">Exportar PDF</button><button class="btn" onclick="exportarRel('csv')">Exportar CSV</button></div>
    </div>

    ${res.linhas.length ? `<div class="tabela"><table><thead><tr>${res.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${res.linhas.slice(0, 300).map(l => `<tr>${l.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${res.linhas.length > 300 ? `<p class="sub" style="margin-top:8px">Mostrando 300 linhas na tela. A exportação inclui todas.</p>` : ""}` : `<div class="vazio">Nenhum dado para estes filtros.</div>`}`;
}
async function exportarRel(fmt) {
  const f = filtros, R = RELATORIOS[f.tipo || "estoque"], res = R.gerar(f), nome = "vegas_" + norm(R.nome).replace(/[^a-z0-9]+/g, "_") + "_" + diaISO(new Date());
  if (fmt === "csv") {
    const csv = [res.cols, ...res.linhas].map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
    baixar(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }), nome + ".csv"); return;
  }
  const pdf = new window.jspdf.jsPDF({ orientation: res.cols.length > 7 ? "landscape" : "portrait" });
  const y = await cabecalhoPdf(pdf, R.nome, descFiltros(f));
  pdf.autoTable({ startY: y, head: [res.cols], body: res.linhas, theme: "grid", styles: { fontSize: 8, cellPadding: 1.6 }, headStyles: { fillColor: [30,32,36], textColor: 235 } });
  if (res.total) { pdf.setFontSize(10); pdf.setFont("helvetica","bold"); pdf.text(res.total, 14, pdf.lastAutoTable.finalY + 8); }
  rodapePdf(pdf); pdf.save(nome + ".pdf");
}
function baixar(blob, nome) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ───────── PDF ───────── */
let logoData = null;
async function logo() {
  if (logoData !== null) return logoData;
  try { const b = await (await fetch("assets/vegaslogo.jpg")).blob(); logoData = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
  catch (e) { logoData = ""; }
  return logoData;
}
async function cabecalhoPdf(pdf, titulo, filtrosTxt) {
  const W = pdf.internal.pageSize.getWidth();
  pdf.setFillColor(0,0,0); pdf.rect(0,0,W,32,"F");
  const l = await logo(); if (l) try { pdf.addImage(l, "JPEG", 10, 4, 24, 24); } catch (e) {}
  pdf.setTextColor(232,234,236); pdf.setFont("helvetica","bold"); pdf.setFontSize(18); pdf.text("VEGAS", 38, 15);
  pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.text("VIGILÂNCIA E SEGURANÇA", 38, 20);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(12); pdf.text(titulo, W - 12, 14, { align: "right" });
  pdf.setFont("helvetica","normal"); pdf.setFontSize(8);
  pdf.text(`Emitido em ${new Date().toLocaleString("pt-BR")} por ${EU.nome}`, W - 12, 20, { align: "right" });
  if (filtrosTxt) pdf.text(filtrosTxt, W - 12, 25, { align: "right" });
  pdf.setTextColor(20,20,20);
  return 40;
}
function rodapePdf(pdf) {
  const n = pdf.getNumberOfPages(), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFontSize(7.5); pdf.setTextColor(130); pdf.text(`Vegas Vigilância e Segurança · página ${i} de ${n}`, W / 2, H - 6, { align: "center" }); }
}
function linhasDados(pdf, y, pares) { pdf.setFontSize(10); pares.forEach(([k,v]) => { pdf.setTextColor(110); pdf.text(k, 14, y); pdf.setTextColor(20); pdf.text(String(v ?? ""), 58, y); y += 6; }); return y + 2; }
async function pdfEntrega(p, r) {

  y = linhasDados(pdf, y, [["Protocolo", p.protocolo], ["Entrega", r.lote], ["Funcionário", p.nome], ["CPF", p.cpf], ["Cidade / posto", `${p.cidade} / ${p.posto}`], ["Responsável", EU.nome], ["Data e hora", new Date().toLocaleString("pt-BR")], ["Situação do pedido", r.status]]);
  const tot = r.itens.reduce((s,i) => s + i.qtdEntregue * i.valorUnit, 0);

    foot: [["", "", "", "", "Total", brl(tot)]], theme: "grid", styles: { fontSize: 9 }, headStyles: { fillColor: [30,32,36] }, footStyles: { fillColor: [235,236,238], textColor: 20 } });
  y = pdf.lastAutoTable.finalY + 26;

async function pdfFicha(c) {

  tab("Peças recebidas", ["Data","Protocolo","Peça","Entregue","Pendente","Valor unit.","Responsável"], r.ents.map(e => [fData(e.dataHora), e.protocolo, e.peca + " " + e.tamanho, int(e.qtdEntregue), pendEnt(e), brl(e.valorUnit), e.responsavel]));
  tab("Devoluções", ["Data","Peça","Condição","Boas","Desg.","Danif.","Falt.","Valor ref."], r.devs.map(d => [fData(d.dataHora), d.peca + " " + d.tamanho, d.condicao, d.qtdBoa, d.qtdDesgaste, d.qtdDanificada, d.qtdFaltante, brl(Number(d.valorFaltante||0) + Number(d.valorDanoEstimado||0))]));
  tab("Valores para análise", ["Data","Resumo","Valor","Status"], r.ocs.map(o => [fData(o.dataHora), o.resumo, brl(o.valorTotal), o.status]));

/* ───────── MATERIAIS (fluxo antigo) ───────── */
let MAT = null;
async function vMateriais() {
  if (!MAT) { $("conteudo").innerHTML = `<h2 class="tit">Materiais</h2><p class="sub">Carregando…</p>`;
    try { const r = await api("materiais", {}, { semRender: true }); MAT = r.itens || []; } catch (e) { toast(e.message, true); return; } }

  const f = filtros, ST_M = ["EM ANÁLISE","PENDENTE","SEPARADO","ENTREGUE"];
  const lista = MAT.filter(m => (!f.status || m.status === f.status) && (!f.q || norm(m.nome + " " + m.protocolo + " " + m.material + " " + m.cidade).includes(norm(f.q)))).slice().reverse();

    <div class="barra"><label>Buscar<input value="${esc(f.q||"")}" placeholder="Nome, protocolo, material ou cidade" oninput="filtrar('q',this.value)"></label>
      <label>Status<select onchange="filtrar('status',this.value,1)"><option value="">Todos</option>${ST_M.map(s => `<option ${f.status===s?"selected":""}>${s}</option>`).join("")}</select></label>

    <div class="cards">${lista.slice(0, limite).map(m => `<article class="card"><header><div><b>${esc(m.protocolo || "sem protocolo")}</b><div>${esc(m.nome)}</div></div><span class="selo ${classeSt(m.status)}">${esc(m.status)}</span></header>
      <div class="meta">${esc(m.data)} · ${esc(m.cidade)} · ${esc(m.posto)}</div><div>${esc(m.material)} · qtd ${esc(m.quantidade)}</div>${m.observacao ? `<div class="meta">Obs.: ${esc(m.observacao)}</div>` : ""}
      <div style="display:flex;gap:8px">${m.assinatura && m.assinatura.length > 20 ? `<img class="thumb" src="${esc(m.assinatura)}" alt="Assinatura" onclick="window.open(this.src)">` : ""}${m.foto && m.foto.length > 20 ? `<img class="thumb" src="${esc(m.foto)}" alt="Foto" onclick="window.open(this.src)">` : ""}</div>
      <div class="acoes"><select style="width:auto;min-height:30px" onchange="statusMat(${m.id},this.value)"><option value="">Mudar status…</option>${ST_M.filter(s => s !== m.status).map(s => `<option>${s}</option>`).join("")}</select></div></article>`).join("") || `<div class="vazio">Nenhum pedido de material.</div>`}</div>
    ${lista.length > limite ? `<button class="btn mais" onclick="limite+=60;render()">Mostrar mais</button>` : ""}`;

async function statusMat(id, status) {
  if (!status) return;
  try { const r = await api("statusMaterial", { id, status }); if (!r.sucesso) throw new Error(r.erro); const m = MAT.find(x => x.id === id); m.status = status; toast("Status: " + status); render(); }
  catch (e) { toast(e.message, true); }
}
async function pdfMateriais(status) {
  const l = MAT.filter(m => m.status === status), pdf = new window.jspdf.jsPDF(); const y = await cabecalhoPdf(pdf, "Materiais · " + status);
  pdf.autoTable({ startY: y, head: [["Data","Protocolo","Nome","Cidade","Posto","Material","Qtd"]], body: l.map(m => [m.data, m.protocolo, m.nome, m.cidade, m.posto, m.material, m.quantidade]), theme: "grid", styles: { fontSize: 8 }, headStyles: { fillColor: [30,32,36] } });
  rodapePdf(pdf); pdf.save(`materiais_${status.toLowerCase().replace(/\s+/g, "_")}.pdf`);
  if (status === "ENTREGUE" && l.length && EU.perfil === "admin" && confirm(`PDF gerado com ${l.length} pedido(s) entregue(s).\n\nApagar esses registros da planilha? Esta ação não pode ser desfeita.`)) {
    try { const r = await api("apagarMateriaisEntregues"); if (!r.sucesso) throw new Error(r.erro); toast(`${r.apagados} registro(s) apagado(s).`); MAT = null; render(); } catch (e) { toast(e.message, true); }
  }
}

async function criarUsuario() { const r = await executar("usuarios", { op: "criar", usuario: $("nuU").value, nome: $("nuN").value, perfil: $("nuP").value, senha: $("nuS").value }, "Usuário criado."); }

function modalSenha(usuario) {
  modal(`<h3>Trocar senha</h3><p class="sub">${esc(usuario)}</p><label class="c">Nova senha<input id="mSenha" type="password" autocomplete="new-password"></label><div class="erro-m" id="mErro" hidden></div>

}

/* ───────── modal ───────── */
function modal(html, largo) {
  fecharModal();
  const f = document.createElement("div"); f.className = "fundo"; f.id = "fundoModal";
  f.innerHTML = `<div class="modal ${largo ? "largo" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  f.addEventListener("mousedown", e => { if (e.target === f) fecharModal(); });
  document.body.appendChild(f);
}
function fecharModal() { const f = $("fundoModal"); if (f) f.remove(); }
function erroModal(msg) { const e = $("mErro"); if (e) { e.textContent = msg; e.hidden = false; } else toast(msg, true); }
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });

if (TOKEN && EU) iniciar();
